services:

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: vouchervault
    restart: unless-stopped
    environment:
      - DOMAIN=192.168.86.47
      - SECURE_COOKIES=False
      - EXPIRY_THRESHOLD_DAYS=90
      - TZ=Europe/Dublin
      - SESSION_EXPIRE_AT_BROWSER_CLOSE=False
      - BALANCE_WORKER_URL=http://balance-worker:3001
    expose:
      - 8000
    ports:
      - 8000:8000
    volumes:
      - ./volume-data/database:/opt/app/database
    depends_on:
      - redis
      - balance-worker

  balance-worker:
    build:
      context: ./balance-worker
      dockerfile: Dockerfile
    container_name: vouchervault-balance-worker
    restart: unless-stopped
    expose:
      - 3001
    # No ports exposed externally - only accessible via internal Docker network

  redis:
    image: redis:7-alpine
    container_name: vouchervault-redis
    restart: unless-stopped
    expose:
      - 6379
