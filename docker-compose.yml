services:

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: vouchervault
    restart: unless-stopped
    environment:
      - DOMAIN=192.168.86.47,vouchers.amarbari.net
      - SECURE_COOKIES=False
      - EXPIRY_THRESHOLD_DAYS=90
      - TZ=Europe/Dublin
      - SESSION_EXPIRE_AT_BROWSER_CLOSE=False
      - BALANCE_WORKER_URL=http://balance-worker:3001
    expose:
      - 8000
    ports:
      - 8000:8000
    volumes:
      - ./volume-data/database:/opt/app/database
    depends_on:
      - redis
      - balance-worker
    # ── Traefik reverse proxy (via baps-oj-selfhost network) ──
    networks:
      - default
      - baps-oj-selfhost
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vouchervault.rule=Host(`vouchers.amarbari.net`)"
      - "traefik.http.routers.vouchervault.entrypoints=web"
      - "traefik.http.services.vouchervault.loadbalancer.server.port=8000"

  balance-worker:
    build:
      context: ./balance-worker
      dockerfile: Dockerfile
    container_name: vouchervault-balance-worker
    restart: unless-stopped
    expose:
      - 3001

  redis:
    image: redis:7-alpine
    container_name: vouchervault-redis
    restart: unless-stopped
    expose:
      - 6379

networks:
  baps-oj-selfhost:
    external: true
    name: baps-oj-selfhost
